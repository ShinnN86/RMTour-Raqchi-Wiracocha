<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Templo 3D interactivo</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <link rel="stylesheet" href="Estilos.css">

</head>

<body>

  <div id="mobileControls">

    <button id="btnW">▲</button>

    <div class="fila">
      <button id="btnA">◀</button>
      <button id="btnS">▼</button>
      <button id="btnD">▶</button>
    </div>

  </div>


  <div id="mobileHeight">

    <button id="btnUp">+</button>
    <button id="btnDown">−</button>

  </div>


  <div id="infoBox">

    <h3 id="titulo"></h3>

    <p id="descripcion"></p>

  </div>


  <canvas id="lineCanvas"></canvas>


  <!--<div id="debugBox">
    <b>Objetos interactivos</b>
    <ul id="listaObjetos"></ul>
  </div>-->


  <a-scene
    id="scene"
  webxr="optionalFeatures: hit-test, local-floor"
  renderer="alpha: true; antialias: true"
  vr-mode-ui="enabled: true">


    <a-assets>

      <a-asset-item
        id="modeloGLB"
        src="WiracochaTemplov5O.glb">
      </a-asset-item>

    </a-assets>



    <a-sky
      id="sky"
      color="#87CEEB">
    </a-sky>


 

    <a-light
      type="ambient"
      color="#dfe8ff"
      intensity="0.65">
    </a-light>



    <a-light
      type="directional"
      color="#fff5d6"
      intensity="1.9"
      position="6 10 4"
      castShadow="true">
    </a-light>



    <a-light
      type="directional"
      color="#cfe7ff"
      intensity="1.2"
      position="-6 4 -4">
    </a-light>



    <a-light
      type="directional"
      color="#ffe9c0"
      intensity="0.8"
      position="0 6 -8">
    </a-light>


    <a-entity
      id="templo"
      gltf-model="#modeloGLB"
      position="0 0 2"
      scale=".4 .4 .4">
    </a-entity>


    <a-entity
      camera
      look-controls
      wasd-controls="acceleration:80"
      position="0 1.6 5">

      <a-cursor rayOrigin="entity"></a-cursor>

    </a-entity>


  </a-scene>


  <script src="script.js"></script>


  <script>

    const scene = document.querySelector("#scene");

    const sky = document.querySelector("#sky");

    const templo = document.querySelector("#templo");

    scene.addEventListener("enter-vr", () => {

      if (scene.is("ar-mode")) {

        console.log("Modo AR iniciado");


        sky.setAttribute("visible", false);

        templo.setAttribute(
          "position",
          "0 0 -11"
        );


        templo.setAttribute(
          "scale",
          "0.3 0.3 0.3"
        );

      }

    });


    scene.addEventListener("exit-vr", () => {

      console.log("Saliendo AR");

      sky.setAttribute(
        "visible",
        true
      );


      templo.setAttribute(
        "position",
        "0 0 2"
      );



      templo.setAttribute(
        "scale",
        "0.4 0.4 0.4"
      );

    });

  </script>


</body>

</html>
